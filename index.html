<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wheelie Life PR — prototype</title>
    <meta name="theme-color" content="#0b0d12" />
    <meta name="description" content="Wheelie Life PR — Calles, Bikes, Isla, Libertad." />

    <!-- Pacifico, for one thing: the Abierto hoarding.
         It is the face abierto.app actually sets its wordmark in, and a real
         sign painted in somebody else's font is not their sign. Loaded async
         and the texture repaints itself when it arrives (see
         makeAbiertoBillboard), so a slow font never delays the city. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
          onload="this.onload=null;this.rel='stylesheet'" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
